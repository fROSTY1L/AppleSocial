type Query {
  getUser(id: ID!): User
  getChats(userId: ID!): [Chat!]!
  searchUsers(keyword: String!): [User!]!
  getMessages(chatId: ID!): [Message!]!
}

type Mutation {
  signUp(input: SignUpInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
  createChat(input: CreateChatInput!): Chat!
  sendMessage(input: SendMessageInput!): Message!
  addFriend(friendId: ID!): Friend!
  acceptFriend(friendId: ID!): Friend!
}

input SignUpInput {
  username: String!
  login: String!
  password: String!
}

input LoginInput {
  login: String!
  password: String!
}

type AuthPayload {
  token: String!
  user: User!
}

input CreateChatInput {
  userIds: [ID!]!
  title: String
  isGroup: Boolean!
}

input SendMessageInput {
  chatId: ID!
  content: String!
}

type AuthPayload {
  token: String!
  user: User!
}

type User {
  id: ID!
  login: String!
  username: String!
  avatar: String
  friends: [Friend!]!
  chats: [Chat!]!
}

type Chat {
  id: ID!
  title: String
  isGroup: Boolean!
  members: [User!]!
  messages: [Message!]!
  createdAt: String!
}

type Message {
  id: ID!
  content: String!
  sender: User!
  chat: Chat!
  createdAt: String!
}

type Friend {
  id: ID!
  user: User!
  friend: User!
  status: FriendStatus!
  createdAt: String!
}

enum FriendStatus {
  PENDING
  ACCEPTED
  REJECTED
}